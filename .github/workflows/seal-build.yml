name: seal-build
on:
  workflow_dispatch: {}
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '0.10'
      - name: Pack (CI config excluded from the tarball)
        run: |
          rm -rf .github
          npm pack
          tar tzvf traverse-0.6.6.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: traverse-0.6.6
          path: traverse-0.6.6.tgz
          if-no-files-found: error
